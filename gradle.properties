pluginGroup = com.kevingosse
pluginVersion = 0.6.0

# NOTE: the build base is the locally-installed Rider (see build.gradle.kts) so we can compile against
# the bundled com.intellij.mcpServer. These two are vestigial (kept for reference/fallback).
platformType = IC
platformVersion = 2024.3

# --- CI / download build (see build.gradle.kts) ------------------------------------------------
# Used only when no local Rider (riderLocalPath/RIDER_HOME) or local Agent Workbench plugin
# (agentWorkbenchPluginPath/AGENT_WORKBENCH_PLUGIN) is configured — i.e. on CI runners. The build
# then downloads this Rider build and resolves the Agent Workbench plugin from the Marketplace.
# TIGHTLY COUPLED: agent-workbench's since/until-build pins it to one Rider build, so bump together
# (versions: https://plugins.jetbrains.com/plugin/com.intellij.agent.workbench/versions).
# Must be an air.*-API build (>= 262.8665): 2026.2 EAP9 is the first build carrying the air.* API, and a
# single artifact built against it serves both 2026.2 EAP9+ and all of 2026.3 (AWB 263.1445 changed some
# air.* signatures; the seam absorbs that at runtime — see docs/AWB-2026.3-COMPAT.md, 2026-07-10 update).
# 2026.2 is still EAP, so riderVersion is a snapshot
# resolved from the snapshots repo (downloaded via the maven artifact, useInstaller=false).
# When bumping to a newer EAP, bump agentWorkbenchVersion in lockstep and re-verify the EP shapes.
riderVersion = 2026.2-EAP9-SNAPSHOT
agentWorkbenchVersion = 262.8665.20260706

# --- Local build paths (machine-specific; set these for your environment) ----------------------
# build.gradle.kts builds/runs against a locally-installed Rider and compiles the air.* seam against the
# installed Agent Workbench plugin. Both locations differ per machine, so they are NOT committed. Set them
# in ~/.gradle/gradle.properties, pass -P..., or use the env-var fallbacks (RIDER_HOME /
# AGENT_WORKBENCH_PLUGIN). Both must be an air.*-era build (Rider EAP9+ and the `air-plugin` install — NOT
# the old 262.8377 `agent-workbench-plugin`).
# riderLocalPath = C:/Users/<you>/AppData/Local/Programs/Rider
# agentWorkbenchPluginPath = C:/Users/<you>/AppData/Roaming/JetBrains/Rider2026.2/plugins/air-plugin

# The Kotlin stdlib is provided by the IDE platform; don't bundle our own.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.caching = true
