pluginGroup = com.kevingosse
pluginVersion = 0.5.0

# --- Dual AWB target (see build.gradle.kts "Dual build variants" block) --------------------------
# The plugin ships as TWO build variants of the SAME plugin id, selected by this property:
#   -PawbTarget=262  → Agent Workbench 2026.2 (build 262), the current/default artifact.
#   -PawbTarget=263  → 2026.3 (build 263), the port for the renamed `com.intellij.air.*` API.
# The Marketplace serves the right one per IDE build via since/until-build (262 is capped at 262.*,
# 263 starts at 263). The variant selects which of src/awb262 vs src/awb263 is compiled in.
awbTarget = 262

# NOTE: the build base is the locally-installed Rider (see build.gradle.kts) so we can compile against
# the bundled com.intellij.mcpServer. These two are vestigial (kept for reference/fallback).
platformType = IC
platformVersion = 2024.3

# --- 262 target: CI / download build (see build.gradle.kts) -----------------------------------
# Used only when no local Rider (riderLocalPath/RIDER_HOME) or local Agent Workbench plugin
# (agentWorkbenchPluginPath/AGENT_WORKBENCH_PLUGIN) is configured — i.e. on CI runners. The build
# then downloads this Rider build and resolves the Agent Workbench plugin from the Marketplace.
# TIGHTLY COUPLED: agent-workbench's since/until-build pins it to one Rider build, so bump together
# (versions: https://plugins.jetbrains.com/plugin/com.intellij.agent.workbench/versions).
# The 262 / 2026.2 platform is EAP-only for now, so riderVersion is a snapshot resolved from the
# snapshots repo (downloaded via the maven artifact, useInstaller=false — see build.gradle.kts).
# Local dev base is Rider build 262.8377 with Agent Workbench 262.8377.*. CI is ANCHORED on the
# matching published EAP (2026.2-EAP8 = build 262.8377.34). When bumping to a newer EAP, bump
# agentWorkbenchVersion in lockstep and re-verify the EP shapes.
riderVersion = 2026.2-EAP8-SNAPSHOT
agentWorkbenchVersion = 262.8377.20260625

# --- 263 target: CI / download build -----------------------------------------------------------
# The 2026.3 platform (build 263) is a rolling snapshot resolved from the snapshots repo.
riderVersion263 = 2026.3-SNAPSHOT
# INTENTIONALLY EMPTY. Agent Workbench 263 is published on NO public channel yet (verified
# 2026-07-06: the newest Marketplace AWB is 262.8665.20260706, and the 263 build is NOT bundled in the
# riderRD-2026.3-SNAPSHOT zip either — verified from its central directory). Until an AWB 263 is
# published, the 263 target can only be built against a LOCALLY-supplied 263 plugin install via
# agentWorkbenchPluginPath263 / AGENT_WORKBENCH_PLUGIN_263 (below). With neither set, build.gradle.kts
# fails fast with an explanatory error rather than resolving a wrong (262) AWB build.
agentWorkbenchVersion263 =

# --- Local build paths (machine-specific; set these for your environment) ----------------------
# 262 target: build.gradle.kts builds/runs against a locally-installed Rider and compiles the awb262
# package against the installed Agent Workbench plugin. Both locations differ per machine, so they are
# NOT committed. Set them in ~/.gradle/gradle.properties, pass -P..., or use the env-var fallbacks
# (RIDER_HOME / AGENT_WORKBENCH_PLUGIN). riderLocalPath applies to the 262 target ONLY (it's a 262 install).
# riderLocalPath = C:/Users/<you>/AppData/Local/Programs/Rider
# agentWorkbenchPluginPath = C:/Users/<you>/AppData/Roaming/JetBrains/Rider2026.2/plugins/agent-workbench-plugin
#
# 263 target: supply a locally-installed AWB 263 plugin here (or via AGENT_WORKBENCH_PLUGIN_263) to
# compile the awb263 package against it; optionally a local 263 Rider base (or RIDER_HOME_263) for when
# one exists locally. Until AWB 263 is public, agentWorkbenchPluginPath263 is the ONLY way to build 263.
# agentWorkbenchPluginPath263 = C:/Users/<you>/AppData/Roaming/JetBrains/Rider2026.3/plugins/agent-workbench-plugin
# riderLocalPath263 = C:/Users/<you>/AppData/Local/Programs/Rider 2026.3 EAP

# The Kotlin stdlib is provided by the IDE platform; don't bundle our own.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.caching = true
