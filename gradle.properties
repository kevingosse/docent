pluginGroup = com.kevingosse
pluginVersion = 0.8.3

# NOTE: the build base is the locally-installed Rider (see build.gradle.kts) so we can compile against
# the bundled com.intellij.mcpServer. These two are vestigial (kept for reference/fallback).
platformType = IC
platformVersion = 2024.3

# --- CI / download build (see build.gradle.kts) ------------------------------------------------
# Used only when no local IDE (ideLocalPath/IDE_HOME, or riderLocalPath/RIDER_HOME) is configured — i.e. on
# CI runners. The build then downloads this IntelliJ IDEA Ultimate build; Air is BUNDLED in it, so there is no
# separate Marketplace coordinate any more. The seam is compiled against the bundled Air of exactly this build
# (Air is pinned to one IDE build), so bump this in lockstep with the local dev IDE and re-verify the EP shapes.
# NB: 263.4953 is the local dev build (IDEA 2026.3 nightly with Air 263.4953); if the IJ repository doesn't carry that
# exact snapshot, CI must use the nearest published 263 EAP that bundles Air.
ideaVersion = 263.4953-EAP-SNAPSHOT

# --- Local build paths (machine-specific; set these for your environment) ----------------------
# build.gradle.kts builds against a locally-installed 2026.3 IDE that bundles Air (IntelliJ IDEA 263.4739+) and
# compiles the air.* seam against that bundled plugin. Set in ~/.gradle/gradle.properties, pass -P..., or use the
# env-var fallbacks (IDE_HOME / RIDER_HOME / AIR_PLUGIN). `riderLocalPath` is the `runRider` target and the
# fallback compile base; `airPluginPath` overrides the bundled Air with a standalone `air-plugin` install.
# ideLocalPath = C:/Users/<you>/AppData/Local/Programs/IntelliJ IDEA
# riderLocalPath = C:/Users/<you>/AppData/Local/Programs/Rider
# airPluginPath = C:/Users/<you>/AppData/Roaming/JetBrains/IntelliJIdea2026.3/plugins/air-plugin

# The Kotlin stdlib is provided by the IDE platform; don't bundle our own.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -XX:+UseParallelGC
org.gradle.caching = true
