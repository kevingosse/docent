name: Verify (cross-IDE)

# Manual only. The Plugin Verifier downloads full IDE distributions (~1.3 GB) and takes ~8 min, so
# it's deliberately NOT run per-commit — run it on demand before a release, or after touching code
# that uses platform APIs, to confirm the plugin still loads on non-Rider IntelliJ IDEs. The set of
# IDEs and the externalPrefixes/failureLevel live in build.gradle.kts (pluginVerification block).
#
# NB: the verifier `ides {}` list is currently EMPTY (see build.gradle.kts): our since-build floor
# (262.8665) is above every public non-Rider release while 2026.2 is still EAP, so there's no valid
# IDE to verify against yet and `verifyPlugin` effectively no-ops. Re-add a real >= 262.8665 non-Rider
# build here once 2026.2 ships publicly (verified 2026-07-06).
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew verifyPlugin

      # The human-readable per-IDE reports (kept even if verification fails).
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
          if-no-files-found: warn
