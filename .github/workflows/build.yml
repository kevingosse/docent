name: Build

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch/PR. Covers BOTH build jobs below (same group).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# --- Dual-target build (see build.gradle.kts "Dual build variants") -------------------------------
# The one plugin id ships as two build variants selected by `-PawbTarget`. This workflow builds each
# variant in its own job so they run in parallel and fail independently:
#   * build-262 → the current/default artifact (Agent Workbench 2026.2, build 262). Always runs;
#     it is the required/blocking check.
#   * build-263 → the 2026.3 (build 263) port. SKIPPED (not failed) until AWB 263 is
#     published — see the job's `if` gate below.
# Artifacts are named after the produced zip: build.gradle.kts sets the plugin version to
# `<pluginVersion>-<target>` (currently 0.5.0-262 / 0.5.0-263), so the zips land in
# build/distributions/ as code-review-docent-0.5.0-262.zip / code-review-docent-0.5.0-263.zip.
jobs:
  build-262:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Verifies the Gradle wrapper jar against known-good checksums before we run it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # No local Rider / Agent Workbench on the runner, so the build downloads the Rider build named
      # by `riderVersion` and resolves the workbench from the Marketplace (see build.gradle.kts).
      # awbTarget defaults to 262, so plain `buildPlugin` produces the 262 variant.
      - run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: code-review-docent-262
          path: build/distributions/*.zip
          if-no-files-found: error

  # The 263 leg is GATED on a repo variable so it stays SKIPPED (no red X, no failure noise) until
  # Agent Workbench 263 actually exists to build against. AWB 263 is published on NO public
  # channel yet (verified 2026-07-06: newest Marketplace AWB is 262.8665.20260706), while the Rider 263
  # base (2026.3-SNAPSHOT) IS publicly resolvable — so build.gradle.kts fails fast on awbTarget=263
  # unless an AWB-263 source is supplied. Once AWB 263 lands on the Marketplace
  # (https://plugins.jetbrains.com/plugin/30926-agent-workbench/versions), set the repo variable
  # `AWB263_MARKETPLACE_VERSION` to that version string and this job activates on the next run — no
  # commit or workflow edit needed. Clearing the variable disables it again.
  build-263:
    runs-on: ubuntu-latest
    if: vars.AWB263_MARKETPLACE_VERSION != ''
    # The 263 base is the Rider 2026.3 snapshot (~3.8 GB to download), so this job is meaningfully
    # slower than build-262 (which uses the smaller 262 EAP). Give it generous headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Build the 263 variant. `-PawbTarget=263` selects the src/awb263 source tree + the 263 build
      # range; `-PagentWorkbenchVersion263` feeds build.gradle.kts the Marketplace AWB 263 version
      # (the repo variable) so it resolves the workbench instead of failing fast. Rider 2026.3-SNAPSHOT
      # is downloaded from the snapshots repo.
      - run: ./gradlew buildPlugin -PawbTarget=263 "-PagentWorkbenchVersion263=${{ vars.AWB263_MARKETPLACE_VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: code-review-docent-263
          path: build/distributions/*.zip
          if-no-files-found: error
