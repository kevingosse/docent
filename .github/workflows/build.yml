name: Build

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# --- Single universal artifact (see build.gradle.kts header) --------------------------------------
# The plugin ships as ONE artifact built against the Agent Workbench air.* API. It loads on both
# 2026.2 EAP9+ (build 262.8665+) and all of 2026.3 (the air.* API is identical across the two, and
# there is no separately-buildable AWB 263 to target anyway). No local Rider / Agent Workbench on the
# runner, so the build downloads the Rider build named by `riderVersion` and resolves the workbench
# from the Marketplace at `agentWorkbenchVersion` (see build.gradle.kts / gradle.properties).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Verifies the Gradle wrapper jar against known-good checksums before we run it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: code-review-docent
          path: build/distributions/*.zip
          if-no-files-found: error
