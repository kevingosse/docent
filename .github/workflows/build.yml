name: Build

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The plugin ships as ONE artifact built against the Air (ex Agent Workbench) air.* API of one IDE build
# (see build.gradle.kts header). No local IDE on the runner, so the build downloads the IntelliJ IDEA
# Ultimate build named by `ideaVersion` — Air is bundled in it (see build.gradle.kts / gradle.properties).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Verifies the Gradle wrapper jar against known-good checksums before we run it.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: code-review-docent
          path: build/distributions/*.zip
          if-no-files-found: error
