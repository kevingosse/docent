name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.2.0)"
        required: true
        type: string

# --- Single universal artifact release (see build.gradle.kts header) -------------------------------
# One artifact built against the Agent Workbench air.* API, attached to one GitHub Release. It loads on
# both 2026.2 EAP9+ (build 262.8665+) and all of 2026.3. Rider + the workbench are downloaded (see
# build.gradle.kts / gradle.properties).
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + tag
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The input is a plain X.Y.Z and is used verbatim as the plugin version.
      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${{ inputs.version }}' must be X.Y.Z (e.g. 0.2.0)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Override pluginVersion for this build only (no commit back); the released zip carries the
      # requested version, e.g. code-review-docent-<version>.zip.
      - name: Build
        run: ./gradlew buildPlugin -PpluginVersion=${{ inputs.version }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ inputs.version }}"
          build/distributions/*.zip
          --title "v${{ inputs.version }}"
          --generate-notes
