name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.2.0)"
        required: true
        type: string

# --- Dual-target release (see build.gradle.kts "Dual build variants") -----------------------------
# A single job builds both variants and attaches whatever zips it produced to one GitHub Release.
# The 262 zip is always built; the 263 zip is built only when AWB 263 is available (repo variable
# `AWB263_MARKETPLACE_VERSION` set non-empty). A missing 263 zip is EXPECTED and must never fail the
# release — the 263 build step and its artifact are gated, and `gh release create` globs whatever is
# in build/distributions/, so it simply attaches the 262 zip alone when 263 is skipped.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + tag
    # The 263 leg (when enabled) downloads the ~3.8 GB Rider 2026.3 snapshot on top of the 262 build,
    # so allow generous headroom for the combined single-job run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The input stays a plain X.Y.Z; build.gradle.kts appends the target suffix, so the produced
      # zips are code-review-docent-<version>-262.zip / -263.zip.
      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${{ inputs.version }}' must be X.Y.Z (e.g. 0.2.0)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Override pluginVersion for this build only (no commit back); the released zip carries the
      # requested version. As with the Build workflow, Rider + the workbench are downloaded. Default
      # awbTarget=262, so this produces the 262 variant.
      - name: Build 262 variant
        run: ./gradlew buildPlugin -PpluginVersion=${{ inputs.version }}

      # Build the 263 variant into the SAME build/distributions/ dir (distinct -263 suffix, no clash).
      # GATED on the AWB 263 Marketplace version repo variable — see the header comment. If unset
      # this step is skipped and the release ships 262 only; this is intended, not an error. Once AWB
      # 263 is published, set the `AWB263_MARKETPLACE_VERSION` repo variable
      # (https://plugins.jetbrains.com/plugin/30926-agent-workbench/versions) and it activates with no
      # workflow edit.
      - name: Build 263 variant
        if: vars.AWB263_MARKETPLACE_VERSION != ''
        run: ./gradlew buildPlugin -PpluginVersion=${{ inputs.version }} -PawbTarget=263 "-PagentWorkbenchVersion263=${{ vars.AWB263_MARKETPLACE_VERSION }}"

      # Attach every zip that was produced (262 always, 263 when the leg ran).
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ inputs.version }}"
          build/distributions/*.zip
          --title "v${{ inputs.version }}"
          --generate-notes
